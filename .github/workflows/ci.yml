name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not integration" --cov=vision_lab --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run vision prepare
      - run: uv run pytest -m integration
      - run: uv run vision train --epochs 1 --image-size 320
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-training
          path: outputs/training/
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vision-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check imports as the container user
        run: docker run --rm vision-lab:ci python -c "import cv2; import torch; import vision_lab.dashboard"
      - name: Check dashboard health
        run: |
          docker run -d --name vision-ci -p 127.0.0.1:8501:8501 vision-lab:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs vision-ci
          exit 1
