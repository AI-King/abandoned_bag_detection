[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vision-lab"
version = "0.1.0"
description = "Reproducible YOLO video detection, analytics, and MLflow experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
dependencies = [
  "ultralytics>=8.4,<9",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "mlflow>=3.1,<4",
  "streamlit>=1.45,<2",
  "pandas>=2.2,<3",
  "plotly>=6,<8",
  "imageio-ffmpeg>=0.6,<0.7",
  "lap>=0.5.12,<0.6",
  "scipy>=1.13,<2",
  "pyyaml>=6,<7",
]

[project.scripts]
vision = "vision_lab.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pre-commit>=4,<5"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/vision_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real model tests requiring downloaded assets"]

[tool.coverage.run]
source = ["vision_lab"]
